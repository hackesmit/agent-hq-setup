# Log rotation for HQ's long-running writers (hq-fgg3.11). Runs as owner from
# owner's crontab (agent sessions see /etc read-only, so this is not in
# /etc/logrotate.d):
#   10 4 * * * [ -f $HOME/hq/ops/config/logrotate-hq.conf ] && /usr/sbin/logrotate -s $HOME/hq/state/logrotate.state $HOME/hq/ops/config/logrotate-hq.conf
# The su line is required because the log directories are group-writable.
# Both writers append (git-sync.sh uses >>, the hq-mail units use
# StandardOutput=append:), so after copytruncate they keep appending at the new end
# of the truncated file, with no reopen signal needed. Known loss window: a line
# written between the copy and the truncate is in neither file. Neither writer can
# be told to reopen (a tmux loop and systemd append: outputs), and these are
# diagnostic logs whose real failures also go to hq_mail and the journal, so that
# rare loss of one line per rotation is accepted. Rotates past 5M, keeps 4
# compressed copies.
# Check:  /usr/sbin/logrotate -d -s ~/hq/state/logrotate.state ~/hq/ops/config/logrotate-hq.conf
# Revert: remove the crontab line.
/home/owner/hq/ops/git-sync.log
/home/owner/hq/state/mail-poll.log
{
    su owner owner
    size 5M
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
