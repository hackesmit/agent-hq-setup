# HQ workspace tmux config — sourced by hq.sh into the hq session.
# All bindings are no-prefix (Alt-…) so terminal management is one keystroke.

set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g mouse on                        ;# click a pane to focus, drag borders to resize; toggle with Alt-m
set  -g focus-events on                 ;# clean focus tracking so apps reset mouse state on blur
set  -g pane-border-status top
set  -g pane-border-format ' #{?pane_title,#{pane_title},#{pane_index}} '
set  -g display-time 1500

# --- create / kill terminals (auto-tiled, auto-worktree on rig contention) ---
bind -n M-n run-shell "~/hq/ops/scripts/term.sh"
bind -n M-t command-prompt -p "rig (blank = hq):" "run-shell '~/hq/ops/scripts/term.sh %%'"
bind -n M-x confirm-before -p "kill this terminal? (y/n; Alt-h minimizes instead) " "run-shell '~/hq/ops/scripts/term-kill.sh'"

# --- minimize / reopen (park keeps the terminal alive in a hidden 'parked' window) ---
bind -n M-h run-shell "~/hq/ops/scripts/term-park.sh"
bind -n M-o run-shell "~/hq/ops/scripts/term-unpark.sh"

# dead panes never linger: finished workers auto-park (summary readable via Alt-o
# until finish.sh), exited interactive terminals just disappear and the grid re-tiles
set-hook -g pane-died 'run-shell "~/hq/ops/scripts/term-reap.sh #{hook_pane}"'

# --- focus (Alt + arrows) ---
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- resize (Alt + H/J/K/L, hold to repeat) ---
bind -n -r M-H resize-pane -L 3
bind -n -r M-J resize-pane -D 3
bind -n -r M-K resize-pane -U 3
bind -n -r M-L resize-pane -R 3

# --- layout / view ---
bind -n M-z resize-pane -Z                         ;# fullscreen the focused terminal (toggle)
bind -n M-f run-shell "~/hq/ops/scripts/term-retile.sh"   ;# re-tile: 1 full / 2 side-by-side / 3 two+wide / 4 grid
bind -n M-Space next-layout                         ;# cycle tmux layouts
bind -n M-m set -gF mouse "#{?mouse,off,on}" \; display "mouse #{?mouse,ON — drag to move/resize,OFF}"

# --- windows (background services live here; Alt-, / Alt-. to hop) ---
bind -n M-, previous-window
bind -n M-. next-window

# --- discoverability / floating extras (zellij-parity additions, 2026-08-13) ---
bind -n M-/ display-popup -w 72 -h 30 -E "less ~/hq/ops/tmux/KEYS.md"   ;# key cheat-sheet, q to close
bind -n M-s choose-tree -Zw                                             ;# window/session chooser
bind -n M-g display-popup -w 80% -h 75% -E "env -u TMUX tmux new-session -A -s scratch"  ;# floating scratch terminal, survives popup close

# Claude Code panes keep the conversation in normal scrollback instead of the
# alternate screen (affects panes created after this loads; delete to revert)
set-environment -g CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN 1
