# hqbox has one NVMe and nothing else. Check every attribute, track health,
# error-log growth and spare capacity, warn at 70 C and alarm at 80 C, and
# hand alerts to smartd-runner (which runs /etc/smartmontools/run.d/*).
# Canonical copy: ops/services/disk-health/ in the hq repo.
/dev/nvme0 -a -W 0,70,80 -m root -M exec /usr/share/smartmontools/smartd-runner
