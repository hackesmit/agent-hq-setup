# Drop-in for the code-server user unit, installed by install.sh as
# ~/.config/systemd/user/code-server.service.d/hq-auth.conf.
# Fail closed: a missing auth.env stops the unit (no leading "-" on
# EnvironmentFile), and an empty PASSWORD fails the pre-start check
# ($$ keeps systemd from expanding the secret into the command line).
# code-server itself also refuses auth: password with no password.
[Service]
EnvironmentFile=%h/.config/code-server/auth.env
ExecStartPre=/bin/sh -c 'test -n "$$PASSWORD" || { echo "code-server: PASSWORD unset in auth.env, refusing to start" >&2; exit 1; }'
